<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedhil Aksara Jawa Deluxe Edition</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18, ReactDOM & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts: Noto Sans Javanese & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Javanese:wght@500;700&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            jawa: ['"Noto Sans Javanese"', 'serif'],
          },
          colors: {
            jawaDark: '#271c19',
            jawaWood: '#3e2723',
            jawaBrown: '#5d4037',
            jawaGold: '#ffb300',
            jawaCream: '#ffecb3',
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #271c19;
      color: #3e2723;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .bg-batik {
      background: 
        radial-gradient(1200px 600px at 20% -10%, #fff7e6 0%, transparent 60%),
        radial-gradient(900px 500px at 90% 0%, #ffe0b2 0%, transparent 50%),
        linear-gradient(180deg, #fdf6e3 0%, #efebe9 55%, #d7ccc8 100%);
    }

    .batik-overlay {
      position: absolute; inset: 0; opacity: 0.06;
      background-image: 
        repeating-linear-gradient(45deg, #5d4037 0 1px, transparent 1px 14px),
        repeating-linear-gradient(-45deg, #8d6e63 0 1px, transparent 1px 20px);
      pointer-events: none;
    }

    /* Target Cards & Floating Animations */
    .target-card {
      box-shadow: 0 6px 0 #3e2723, 0 10px 18px rgba(0,0,0,0.18);
      transition: border-color 0.3s, background 0.3s, transform 0.2s;
    }

    .target-float-0 { animation: floatAnim0 2.8s ease-in-out infinite; }
    .target-float-1 { animation: floatAnim1 3.2s ease-in-out infinite; }
    .target-float-2 { animation: floatAnim2 2.6s ease-in-out infinite; }
    .target-float-3 { animation: floatAnim3 3.0s ease-in-out infinite; }
    .target-float-4 { animation: floatAnim4 3.4s ease-in-out infinite; }

    @keyframes floatAnim0 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes floatAnim1 { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(6px); } }
    @keyframes floatAnim2 { 0%, 100% { transform: translateY(2px); } 50% { transform: translateY(-7px); } }
    @keyframes floatAnim3 { 0%, 100% { transform: translateY(-6px); } 50% { transform: translateY(4px); } }
    @keyframes floatAnim4 { 0%, 100% { transform: translateY(1px); } 50% { transform: translateY(-9px); } }

    .frozen-target {
      border-color: #0288d1 !important;
      background: linear-gradient(180deg, #e0f7fa 0%, #80deea 100%) !important;
      box-shadow: 0 0 16px #00bcd4, 0 6px 0 #006064 !important;
      animation: none !important;
    }

    .screen-shake {
      animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .cannon-recoil {
      animation: recoilAnim 0.16s ease-out;
    }

    @keyframes recoilAnim {
      0% { transform: translateX(-50%) translateY(0) scale(1); }
      35% { transform: translateX(-50%) translateY(8px) scale(0.96); }
      100% { transform: translateX(-50%) translateY(0) scale(1); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #efebe9; }
    ::-webkit-scrollbar-thumb { background: #8d6e63; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen bg-batik flex flex-col items-center">

  <div class="batik-overlay"></div>

  <!-- React Root App -->
  <div id="root" class="w-full max-w-5xl relative z-10 p-2 sm:p-4"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ==========================================
    // 1. DATA DICTIONARIES & HELPER FUNCTIONS
    // ==========================================
    const CONSONANTS = {
      h: { latin: 'H', jawa: 'ꦲ' },
      n: { latin: 'N', jawa: 'ꦤ' },
      c: { latin: 'C', jawa: 'ꦕ' },
      r: { latin: 'R', jawa: 'ꦫ' },
      k: { latin: 'K', jawa: 'ꦏ' },
      d: { latin: 'D', jawa: 'ꦢ' },
      t: { latin: 'T', jawa: 'ꦠ' },
      s: { latin: 'S', jawa: 'ꦱ' },
      w: { latin: 'W', jawa: 'ꦮ' },
      l: { latin: 'L', jawa: 'ꦭ' },
      p: { latin: 'P', jawa: 'ꦥ' },
      dh: { latin: 'DH', jawa: 'ꦝ' },
      j: { latin: 'J', jawa: 'ꦗ' },
      y: { latin: 'Y', jawa: 'ꦪ' },
      m: { latin: 'M', jawa: 'ꦩ' },
      g: { latin: 'G', jawa: 'ꦒ' },
      b: { latin: 'B', jawa: 'ꦧ' },
      th: { latin: 'TH', jawa: 'ꦛ' },
      ng: { latin: 'NG', jawa: 'ꦔ' },
      ny: { latin: 'NY', jawa: 'ꦚ' }
    };

    const SPECIAL_CONS = {
      "rê": { latin: 'RÊ', jawa: 'ꦉ' },
      "lê": { latin: 'LÊ', jawa: 'ꦊ' }
    };

    const VOWELS = {
      a: { latin: 'A', jawa: '' },
      i: { latin: 'I', jawa: 'ꦶ' },
      u: { latin: 'U', jawa: 'ꦸ' },
      ê: { latin: 'Ê', jawa: 'ꦼ' },
      é: { latin: 'É', jawa: 'ꦺ' },
      o: { latin: 'O', jawa: 'ꦺꦴ' }
    };

    const SUFFIXES = {
      none: { latin: '', jawa: '' },
      ng: { latin: 'NG', jawa: 'ꦁ' },
      r: { latin: 'R', jawa: 'ꦂ' },
      h: { latin: 'H', jawa: 'ꦃ' }
    };

    const WORD_DATABASE = [
      { word: "MAJAPAHIT", syllables: ["MA", "JA", "PA", "HIT"], jawaSyllables: ["ꦩ", "ꦗ", "ꦥ", "ꦲꦶꦠ꧀"] },
      { word: "SURABAYA", syllables: ["SU", "RA", "BA", "YA"], jawaSyllables: ["ꦱꦸ", "ꦫ", "ꦧ", "ꦪ"] },
      { word: "GATOTKACA", syllables: ["GA", "TOT", "KA", "CA"], jawaSyllables: ["ꦒ", "ꦠꦺꦴꦠ꧀", "ꦏ", "ꦕ"] },
      { word: "BATIK", syllables: ["BA", "TIK"], jawaSyllables: ["ꦧ", "ꦠꦶꦏ꧀"] },
      { word: "NUSANTARA", syllables: ["NU", "SAN", "TA", "RA"], jawaSyllables: ["ꦤꦸ", "ꦱꦤ꧀", "ꦠ", "ꦫ"] },
      { word: "SEMARANG", syllables: ["SE", "MA", "RANG"], jawaSyllables: ["ꦱꦼ", "ꦩ", "ꦫꦁ"] }
    ];

    function makeItem(cKey, vKey, sKey) {
      if (SPECIAL_CONS[cKey]) {
        const sc = SPECIAL_CONS[cKey];
        const v = VOWELS[vKey] || VOWELS.a;
        const s = SUFFIXES[sKey] || SUFFIXES.none;
        return {
          latin: `${sc.latin}${vKey === 'a' ? '' : v.latin}${s.latin}`,
          jawa: `${sc.jawa}${vKey === 'a' ? '' : v.jawa}${s.jawa}`,
          cKey, vKey, sKey
        };
      }

      const c = CONSONANTS[cKey] || CONSONANTS.k;
      const v = VOWELS[vKey] || VOWELS.a;
      const s = SUFFIXES[sKey] || SUFFIXES.none;

      return {
        latin: `${c.latin}${v.latin}${s.latin}`,
        jawa: `${c.jawa}${v.jawa}${s.jawa}`,
        cKey, vKey, sKey
      };
    }

    function generateRandomItem(level) {
      let allowedCons = Object.keys(CONSONANTS);
      let allowedVowels = ['a', 'i', 'u'];
      let allowedSuffixes = ['none'];

      if (level >= 2) allowedVowels = ['a', 'i', 'u', 'ê', 'é', 'o'];
      if (level >= 3) allowedSuffixes = ['none', 'ng', 'r', 'h'];
      if (level >= 4) allowedCons = [...allowedCons, 'rê', 'lê'];

      const cKey = allowedCons[Math.floor(Math.random() * allowedCons.length)];
      const vKey = allowedVowels[Math.floor(Math.random() * allowedVowels.length)];
      const sKey = allowedSuffixes[Math.floor(Math.random() * allowedSuffixes.length)];

      return makeItem(cKey, vKey, sKey);
    }

    function generateTargetDeck(correctItem, level) {
      const deck = [{ ...correctItem, isCorrect: true }];
      let attempts = 0;

      while (deck.length < 5 && attempts < 100) {
        attempts++;
        const dummy = generateRandomItem(level);
        if (dummy.jawa !== correctItem.jawa && !deck.some(d => d.jawa === dummy.jawa)) {
          deck.push({ ...dummy, isCorrect: false });
        }
      }

      // Shuffle deck
      deck.sort(() => Math.random() - 0.5);

      // Assign horizontal lane positions (10%, 30%, 50%, 70%, 90%)
      const xLanes = [10, 30, 50, 70, 90];
      return deck.map((item, idx) => ({
        id: 'tgt_' + Math.random().toString(36).substring(2, 7),
        ...item,
        x: xLanes[idx],
        y: 18, // Fixed top row %
        lane: idx
      }));
    }

    // ==========================================
    // 2. AUDIO SYNTHESIZER (Web Audio API)
    // ==========================================
    const AudioSynth = {
      ctx: null,
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playShoot() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch(e) {}
      },
      playHitCorrect() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.04);
            gain.gain.setValueAtTime(0.2, now + idx * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.04);
            osc.stop(now + idx * 0.04 + 0.25);
          });
        } catch(e) {}
      },
      playHitWrong() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.25);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(now + 0.25);
        } catch(e) {}
      },
      playPowerup() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 0.3);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch(e) {}
      }
    };

    // ==========================================
    // 3. MAIN REACT COMPONENT
    // ==========================================
    function App() {
      // Game States
      const [score, setScore] = useState(0);
      const [highScore, setHighScore] = useState(() => {
        try { return parseInt(localStorage.getItem('bedhil_deluxe_highscore') || '0'); } catch(e) { return 0; }
      });
      const [lives, setLives] = useState(3);
      const [level, setLevel] = useState(1);
      const [mode, setMode] = useState('standard'); // 'standard', 'reverse', 'words'
      const [cannonPos, setCannonPos] = useState(50); // 10% - 90%
      const [freezeTimer, setFreezeTimer] = useState(0);
      
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [targets, setTargets] = useState([]);
      
      // Word Mode State
      const [wordObj, setWordObj] = useState(null);
      const [wordIndex, setWordIndex] = useState(0);

      // Boss State
      const [bossActive, setBossActive] = useState(false);
      const [bossHp, setBossHp] = useState(100);
      const [bossTarget, setBossTarget] = useState(null);

      // Modals & Effects
      const [isGameOver, setIsGameOver] = useState(false);
      const [paugeranOpen, setPaugeranOpen] = useState(false);
      const [screenShake, setScreenShake] = useState(false);
      const [recoil, setRecoil] = useState(false);
      const [floatingTexts, setFloatingTexts] = useState([]);

      // Refs for Physics Loop
      const bulletsRef = useRef([]);
      const powerupsRef = useRef([]);
      const canvasRef = useRef(null);
      const particlesRef = useRef([]);
      const gameStateRef = useRef({});

      // Synchronize latest state to ref for animation loop
      useEffect(() => {
        gameStateRef.current = {
          score, lives, level, mode, cannonPos, freezeTimer,
          currentQuestion, targets, bossActive, bossHp, isGameOver,
          wordObj, wordIndex
        };
      }, [score, lives, level, mode, cannonPos, freezeTimer, currentQuestion, targets, bossActive, bossHp, isGameOver, wordObj, wordIndex]);

      // Initialize or Load Next Question
      const loadNextQuestion = useCallback((newScore = score, newMode = mode, newLevel = level) => {
        if (isGameOver) return;

        // Check Boss Event Trigger (every 100 points)
        if (newScore > 0 && newScore % 100 === 0 && !bossActive) {
          setBossActive(true);
          setBossHp(100);
          const q = generateRandomItem(newLevel);
          setBossTarget(q);
          setCurrentQuestion(q);
          setTargets([]);
          return;
        }

        let q = null;
        if (newMode === 'words') {
          let currentW = wordObj;
          let idx = wordIndex;
          if (!currentW || idx >= currentW.syllables.length) {
            currentW = WORD_DATABASE[Math.floor(Math.random() * WORD_DATABASE.length)];
            idx = 0;
            setWordObj(currentW);
            setWordIndex(0);
          }
          const sylLatin = currentW.syllables[idx];
          const sylJawa = currentW.jawaSyllables[idx];
          q = { latin: sylLatin, jawa: sylJawa, cKey: 'k', vKey: 'a', sKey: 'none' };
        } else {
          q = generateRandomItem(newLevel);
        }

        setCurrentQuestion(q);
        const deck = generateTargetDeck(q, newLevel);
        setTargets(deck);
      }, [score, mode, level, bossActive, isGameOver, wordObj, wordIndex]);

      // Initialize Game
      useEffect(() => {
        loadNextQuestion(0, mode, level);
      }, []);

      // Canvas Explosions
      const addParticles = (xPct, yPct, color = '#ffb300', count = 20) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const px = (xPct / 100) * canvas.width;
        const py = (yPct / 100) * canvas.height;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 5;
          particlesRef.current.push({
            x: px, y: py,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            radius: 2 + Math.random() * 4,
            color: color,
            alpha: 1,
            decay: 0.02 + Math.random() * 0.03
          });
        }
      };

      // Add Floating Score Indicator Text
      const spawnFloatingText = (x, y, text, color) => {
        const id = 'ft_' + Math.random().toString(36).substring(2, 7);
        setFloatingTexts(prev => [...prev, { id, x, y, text, color }]);
        setTimeout(() => {
          setFloatingTexts(prev => prev.filter(item => item.id !== id));
        }, 800);
      };

      // Shoot Bullet Action
      const shootCannon = () => {
        if (isGameOver) return;
        AudioSynth.playShoot();

        setRecoil(true);
        setTimeout(() => setRecoil(false), 150);

        bulletsRef.current.push({
          id: 'b_' + Math.random().toString(36).substring(2, 7),
          x: cannonPos,
          y: 78 // Starts near cannon mouth
        });
      };

      // Power-up Activations
      const triggerPowerup = (type) => {
        AudioSynth.playPowerup();
        if (type === 'pasopati') {
          // Destroys 2 wrong distractor targets
          setTargets(prev => {
            let removed = 0;
            return prev.filter(t => {
              if (!t.isCorrect && removed < 2) {
                addParticles(t.x, t.y, '#00bcd4', 25);
                removed++;
                return false;
              }
              return true;
            });
          });
        } else if (type === 'gundala') {
          setFreezeTimer(5);
        } else if (type === 'banyuMili') {
          setLives(prev => Math.min(3, prev + 1));
        }
      };

      // Main Loop (Bullets, Collisions, Powerups, Canvas)
      useEffect(() => {
        let animationFrameId;

        const loop = () => {
          const state = gameStateRef.current;

          // Freeze Timer countdown
          if (state.freezeTimer > 0) {
            setFreezeTimer(prev => Math.max(0, prev - 0.016));
          }

          // Random Powerup Spawner (1.5% chance if empty)
          if (powerupsRef.current.length === 0 && Math.random() < 0.0015) {
            const types = ['pasopati', 'gundala', 'banyuMili'];
            powerupsRef.current.push({
              id: 'p_' + Math.random().toString(36).substring(2, 7),
              type: types[Math.floor(Math.random() * types.length)],
              x: 15 + Math.random() * 70,
              y: 15
            });
          }

          // Move Powerups
          powerupsRef.current.forEach(p => p.y += 0.15);

          // Move Bullets
          const bullets = bulletsRef.current;
          for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.y -= 2.0; // Bullet upward speed

            // Check Collision with Powerup
            for (let j = powerupsRef.current.length - 1; j >= 0; j--) {
              const pw = powerupsRef.current[j];
              if (Math.abs(b.x - pw.x) < 8 && Math.abs(b.y - pw.y) < 8) {
                triggerPowerup(pw.type);
                addParticles(pw.x, pw.y, '#00e676', 20);
                powerupsRef.current.splice(j, 1);
                bullets.splice(i, 1);
                break;
              }
            }

            if (!bullets[i]) continue;

            // Check Collision with Boss (if active)
            if (state.bossActive) {
              if (b.y <= 28 && Math.abs(b.x - 50) < 25) {
                AudioSynth.playHitCorrect();
                addParticles(b.x, b.y, '#ef4444', 30);
                bullets.splice(i, 1);

                setBossHp(prevHp => {
                  const nextHp = prevHp - 25;
                  if (nextHp <= 0) {
                    setBossActive(false);
                    setScore(s => {
                      const newS = s + 50;
                      if (newS > highScore) {
                        setHighScore(newS);
                        try { localStorage.setItem('bedhil_deluxe_highscore', newS.toString()); } catch(e) {}
                      }
                      return newS;
                    });
                    loadNextQuestion(state.score + 50, state.mode, state.level);
                  }
                  return Math.max(0, nextHp);
                });
                continue;
              }
            }

            // Check Collision with Target Boxes
            if (state.targets && state.targets.length > 0) {
              for (let k = 0; k < state.targets.length; k++) {
                const t = state.targets[k];
                if (Math.abs(b.x - t.x) < 7 && Math.abs(b.y - t.y) < 7) {
                  bullets.splice(i, 1);

                  if (t.isCorrect) {
                    // CORRECT HIT!
                    AudioSynth.playHitCorrect();
                    addParticles(t.x, t.y, '#ffb300', 30);
                    spawnFloatingText(t.x, t.y, '+10', '#ffb300');

                    const newScore = state.score + 10;
                    setScore(newScore);
                    if (newScore > highScore) {
                      setHighScore(newScore);
                      try { localStorage.setItem('bedhil_deluxe_highscore', newScore.toString()); } catch(e) {}
                    }

                    if (state.mode === 'words' && state.wordObj) {
                      setWordIndex(idx => idx + 1);
                    }

                    loadNextQuestion(newScore, state.mode, state.level);
                  } else {
                    // WRONG HIT!
                    AudioSynth.playHitWrong();
                    addParticles(t.x, t.y, '#ef4444', 25);
                    spawnFloatingText(t.x, t.y, '-5', '#ef4444');

                    setScore(s => Math.max(0, s - 5));
                    setScreenShake(true);
                    setTimeout(() => setScreenShake(false), 350);

                    setLives(l => {
                      const newL = l - 1;
                      if (newL <= 0) setIsGameOver(true);
                      return Math.max(0, newL);
                    });
                  }
                  break;
                }
              }
            }

            // Remove Bullet offscreen
            if (b && b.y < 5) {
              bullets.splice(i, 1);
            }
          }

          // Remove Powerups offscreen
          powerupsRef.current = powerupsRef.current.filter(p => p.y < 85);

          // Render Canvas Particles
          const canvas = canvasRef.current;
          if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let pIdx = particlesRef.current.length - 1; pIdx >= 0; pIdx--) {
              const pt = particlesRef.current[pIdx];
              pt.x += pt.vx;
              pt.y += pt.vy;
              pt.alpha -= pt.decay;

              if (pt.alpha <= 0) {
                particlesRef.current.splice(pIdx, 1);
                continue;
              }

              ctx.save();
              ctx.globalAlpha = pt.alpha;
              ctx.fillStyle = pt.color;
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          }

          animationFrameId = requestAnimationFrame(loop);
        };

        animationFrameId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animationFrameId);
      }, [loadNextQuestion, highScore]);

      // Handle Resize Canvas
      useEffect(() => {
        const handleResize = () => {
          if (canvasRef.current) {
            canvasRef.current.width = canvasRef.current.offsetWidth;
            canvasRef.current.height = canvasRef.current.offsetHeight;
          }
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // Keyboard Listener
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.code === 'Space') {
            e.preventDefault();
            shootCannon();
          } else if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
            setCannonPos(pos => Math.max(10, pos - 5));
          } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
            setCannonPos(pos => Math.min(90, pos + 5));
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isGameOver, cannonPos]);

      // Restart Game
      const restartGame = () => {
        setScore(0);
        setLives(3);
        setIsGameOver(false);
        setBossActive(false);
        setFreezeTimer(0);
        bulletsRef.current = [];
        powerupsRef.current = [];
        loadNextQuestion(0, mode, level);
      };

      return (
        <div className="flex flex-col gap-3">
          
          <!-- TOP HUD HEADER -->
          <header className="bg-[#3e2723] text-[#ffecb3] rounded-2xl p-3 sm:p-4 shadow-xl border-2 border-[#5d4037] flex flex-wrap justify-between items-center gap-2">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-[#ffb300] text-[#3e2723] rounded-xl flex items-center justify-center font-black text-xl shadow-md border-2 border-[#fff8e1]">
                🎯
              </div>
              <div>
                <h1 className="font-black text-sm sm:text-base tracking-wider leading-none text-[#fff8e1]">BEDHIL AKSARA JAWA</h1>
                <p className="font-jawa text-xs sm:text-sm text-[#ffcc80] mt-1">ꦧꦼꦝꦶꦭ꧀ꦲꦏ꧀ꦱꦫꦗꦮ - DELUXE</p>
              </div>
            </div>

            <!-- Stats Pills -->
            <div className="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm font-bold">
              <div className="bg-[#4e342e] border border-[#6d4c41] px-3 py-1.5 rounded-full flex items-center gap-1.5 text-[#ffe0b2]">
                <span>⭐ Skor:</span>
                <span className="text-[#ffb300] font-extrabold text-base">{score}</span>
              </div>

              <div className="bg-[#4e342e] border border-[#6d4c41] px-3 py-1.5 rounded-full flex items-center gap-1.5 text-[#ffe0b2]">
                <span>🏆 Rekor:</span>
                <span className="text-[#fff8e1] font-bold">{highScore}</span>
              </div>

              <div className="bg-[#4e342e] border border-[#6d4c41] px-3 py-1.5 rounded-full flex items-center gap-1 text-red-400 font-mono tracking-widest text-base">
                {'❤'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives))}
              </div>
            </div>
          </header>

          <!-- MAIN GAME SHELL GRID -->
          <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">

            <!-- GAME BATTLEFIELD (3 COLS) -->
            <div className="lg:col-span-3 flex flex-col gap-3">

              <div id="gameArea" className={`relative w-full h-[500px] sm:h-[540px] bg-gradient-to-b from-[#fff8e1] via-[#ffe0b2] to-[#d7a76f] rounded-2xl border-4 border-[#3e2723] shadow-2xl overflow-hidden flex flex-col justify-between ${screenShake ? 'screen-shake' : ''}`}>
                
                <!-- Canvas Overlay for Particle FX -->
                <canvas ref={canvasRef} class="absolute inset-0 w-full h-full pointer-events-none z-20"></canvas>

                <!-- Floating Text Indicators (+10 / -5) -->
                {floatingTexts.map(item => (
                  <div key={item.id} className="absolute font-black text-2xl z-30 pointer-events-none animate-bounce" style={{ left: `${item.x}%`, top: `${item.y}%`, color: item.color }}>
                    {item.text}
                  </div>
                ))}

                <!-- Top Status Notification Badges -->
                <div className="absolute top-3 left-3 right-3 z-10 flex justify-between items-center pointer-events-none">
                  <div className="bg-[#3e2723]/90 text-[#ffecb3] border border-[#ffb300] px-3 py-1 rounded-full text-xs font-bold shadow-md">
                    Mode: {mode === 'standard' ? 'Standard (Latin → Aksara)' : mode === 'reverse' ? 'Terbalik (Aksara → Latin)' : 'Rangkai Kata'}
                  </div>

                  {freezeTimer > 0 && (
                    <div className="bg-[#0288d1] text-white border border-[#80deea] px-3 py-1 rounded-full text-xs font-bold shadow-lg animate-pulse">
                      ⚡ GUNDALA (Beku): {Math.ceil(freezeTimer)}s
                    </div>
                  )}
                </div>

                <!-- BOSS CONTAINER (Active during Boss events) -->
                {bossActive && (
                  <div className="absolute top-10 left-1/2 -translate-x-1/2 w-11/12 max-w-md bg-[#3e2723]/95 text-[#fff8e1] border-2 border-red-600 rounded-2xl p-3 shadow-2xl z-30 flex flex-col items-center gap-2">
                    <div className="flex justify-between w-full text-xs font-bold px-1">
                      <span className="text-red-400 font-extrabold flex items-center gap-1">👹 BOS DENAWA</span>
                      <span className="text-[#ffb300]">{bossHp}/100 HP</span>
                    </div>
                    <div className="w-full h-3 bg-[#271c19] rounded-full overflow-hidden border border-[#5d4037]">
                      <div className="h-full bg-gradient-to-r from-red-600 to-yellow-500 transition-all duration-300" style={{ width: `${bossHp}%` }}></div>
                    </div>
                    <div className="text-xs text-[#ffe0b2] font-semibold text-center">
                      Tameng Aksara Bos: <span className="font-jawa text-xl font-bold text-[#ffb300] bg-[#4e342e] px-2 py-0.5 rounded border border-[#ffb300]">{bossTarget ? bossTarget.jawa : 'ꦏ'}</span>
                    </div>
                  </div>
                )}

                <!-- WORD MODE CLUE BANNER -->
                {mode === 'words' && wordObj && (
                  <div className="absolute top-10 left-1/2 -translate-x-1/2 bg-[#3e2723] text-[#fff8e1] border-2 border-[#ffb300] rounded-xl px-4 py-2 shadow-xl z-20 flex items-center gap-3">
                    <span className="text-xs font-bold text-[#ffb300]">KATA:</span>
                    <span className="font-extrabold text-base tracking-widest text-[#fff8e1]">{wordObj.word}</span>
                    <span className="bg-[#5d4037] text-xs px-2 py-0.5 rounded text-[#ffe0b2] font-mono">
                      {wordIndex + 1}/{wordObj.syllables.length}
                    </span>
                  </div>
                )}

                <!-- TARGET BOXES CONTAINER (TOP ROW) -->
                <div className="relative w-full h-full">
                  {!bossActive && targets.map((t, idx) => (
                    <div
                      key={t.id}
                      className={`target-card absolute -translate-x-1/2 w-16 h-18 sm:w-20 sm:h-22 bg-gradient-to-b from-[#fff3e0] to-[#ffcc80] border-3 border-[#5d4037] rounded-2xl flex items-center justify-center text-center font-bold text-xl sm:text-2xl text-[#3e2723] ${freezeTimer > 0 ? 'frozen-target' : `target-float-${idx % 5}`}`}
                      style={{ left: `${t.x}%`, top: `${t.y}%` }}
                    >
                      <span className={mode === 'reverse' ? 'font-bold' : 'font-jawa text-2xl sm:text-3xl'}>
                        {mode === 'reverse' ? t.latin : t.jawa}
                      </span>
                    </div>
                  ))}

                  <!-- POWERUP FLOATING ITEMS -->
                  {powerupsRef.current.map(pw => (
                    <div
                      key={pw.id}
                      className="absolute -translate-x-1/2 w-10 h-10 rounded-full bg-white border-2 border-[#ffb300] shadow-lg flex items-center justify-center text-lg animate-bounce z-20"

                      {pw.type === 'pasopati' ? '🏹' : pw.type === 'gundala' ? '⚡' : '💧'}

                  ))}

                  <!-- PROJECTILES (BULLETS) -->
                  {bulletsRef.current.map(b => (
                    <div
                      key={b.id}
                      className="absolute -translate-x-1/2 w-5 h-5 rounded-full bg-gradient-to-r from-yellow-300 to-orange-500 border border-black shadow-[0_0_12px_#ff9800] z-20"
                      style={{ left: `${b.x}%`, top: `${b.y}%` }}
                    />
                  ))}
                </div>

                <!-- RAIL & CANNON AREA -->
                <div className="relative w-full h-32 bg-gradient-to-t from-[#271c19] via-[#3e2723] to-transparent flex flex-col justify-end items-center pb-2 z-10">
                  
                  <!-- Rail Line -->
                  <div className="absolute bottom-6 left-4 right-4 h-5 bg-gradient-to-b from-[#8d6e63] via-[#5d4037] to-[#271c19] border-2 border-[#1c110f] rounded-lg shadow-inner flex items-center justify-between px-2">
                    {[1, 2, 3, 4, 5, 6, 7].map(n => (
                      <div key={n} className="w-1 h-3 bg-[#1c110f] rounded"></div>
                    ))}
                  </div>

                  <!-- Laser Aim Line -->
                  <div className="absolute bottom-12 w-0.5 border-l border-dashed border-[#ffeb3b] shadow-[0_0_8px_#ffeb3b] z-0 pointer-events-none transition-all duration-75" style={{ height: '340px', left: `${cannonPos}%` }}></div>

                  <!-- Cannon Assembly -->
                  <div className={`absolute bottom-5 w-44 h-28 -translate-x-1/2 flex flex-col items-center justify-end z-10 pointer-events-none transition-all duration-75 ${recoil ? 'cannon-recoil' : ''}`} style={{ left: `${cannonPos}%` }}>
                    
                    <!-- Cannon Barrel -->
                    <div className="w-12 h-7 bg-gradient-to-r from-[#1a1a1a] via-[#4e342e] to-[#1a1a1a] border-2 border-[#1c110f] rounded-t-lg shadow-lg relative flex justify-center items-center">
                      <div className="w-8 h-2 bg-[#271c19] rounded-t"></div>
                    </div>

                    <!-- Cannon Body & Plaque -->
                    <div className="w-40 h-16 bg-gradient-to-b from-[#6d4c41] via-[#4e342e] to-[#271c19] border-3 border-[#1c110f] rounded-2xl shadow-xl flex items-center justify-center relative border-2 border-[#1c110f]">
                      <div className="bg-[#fffdf5] border-2 border-[#1c110f] rounded-xl px-3 py-1 shadow-md text-center">
                        <span className={mode === 'reverse' ? 'font-jawa font-bold text-2xl text-[#1a1a1a]' : 'font-extrabold text-xl text-[#1a1a1a] tracking-wider'}>
                          {currentQuestion ? (mode === 'reverse' ? currentQuestion.jawa : currentQuestion.latin) : '...'}
                        </span>
                      </div>
                    </div>

                    <!-- Cannon Wheels -->
                    <div className="flex justify-between w-32 -mt-3 z-20">
                      <div className="w-8 h-8 rounded-full bg-gradient-to-br from-[#8d6e63] to-[#271c19] border-2 border-[#1c110f] flex items-center justify-center shadow-md">
                        <div className="w-2.5 h-2.5 bg-[#ffecb3] rounded-full border border-black"></div>
                      </div>
                      <div className="w-8 h-8 rounded-full bg-gradient-to-br from-[#8d6e63] to-[#271c19] border-2 border-[#1c110f] flex items-center justify-center shadow-md">
                        <div className="w-2.5 h-2.5 bg-[#ffecb3] rounded-full border border-black"></div>
                      </div>
                    </div>
                  </div>

                </div>

              </div>

              <!-- CONTROLS & SLIDER BAR -->
              <div className="bg-[#fff8e1] border-3 border-[#3e2723] rounded-2xl p-3 shadow-lg flex flex-col sm:flex-row items-center gap-3">
                <div className="w-full sm:flex-1 flex flex-col gap-1">
                  <div className="flex justify-between text-xs font-bold text-[#5d4037]">
                    <span>↔ GESER MERIAM (Panah Kiri/Kanan)</span>
                    <span>{Math.round(cannonPos)}%</span>
                  </div>
                  <input
                    type="range"
                    min="10"
                    max="90"
                    value={cannonPos}
                    onChange={(e) => setCannonPos(parseFloat(e.target.value))}
                    className="w-full h-8 bg-[#d7ccc8] rounded-lg appearance-none cursor-pointer accent-[#ff6f00]"
                  />
                </div>

                <button
                  onClick={shootCannon}
                  className="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-b from-[#ff6f00] to-[#e65100] text-[#fff8e1] font-black text-base rounded-xl border-2 border-[#1c110f] shadow-[0_5px_0_#1c110f] active:translate-y-1 active:shadow-[0_2px_0_#1c110f] flex items-center justify-center gap-2 transition-all"
                >
                  <span>💥 TEMBAK!</span>
                  <span className="text-xs font-normal opacity-80">(Spacebar)</span>
                </button>
              </div>

            </div>

            <!-- SIDEBAR PANEL (1 COL) -->
            <div className="flex flex-col gap-3">
              
              <!-- Mode Selection -->
              <div className="bg-[#fffdf5] border-2 border-[#5d4037] rounded-2xl p-3.5 shadow-md">
                <h2 className="font-bold text-xs uppercase tracking-wider text-[#5d4037] mb-2 flex items-center gap-1.5">
                  <span>🎮</span> MODE PERMAINAN
                </h2>
                <div className="flex flex-col gap-1.5 text-xs font-bold">
                  <button
                    onClick={() => { setMode('standard'); loadNextQuestion(score, 'standard', level); }}
                    className={`w-full text-left px-3 py-2 rounded-xl border border-[#bcaaa4] transition-all ${mode === 'standard' ? 'bg-[#3e2723] text-[#ffecb3]' : 'bg-[#efebe9] text-[#5d4037]'}`}
                  >
                    1. Standard (Latin → Jawa)
                  </button>
                  <button
                    onClick={() => { setMode('reverse'); loadNextQuestion(score, 'reverse', level); }}
                    className={`w-full text-left px-3 py-2 rounded-xl border border-[#bcaaa4] transition-all ${mode === 'reverse' ? 'bg-[#3e2723] text-[#ffecb3]' : 'bg-[#efebe9] text-[#5d4037]'}`}
                  >
                    2. Terbalik (Jawa → Latin)
                  </button>
                  <button
                    onClick={() => { setMode('words'); loadNextQuestion(score, 'words', level); }}
                    className={`w-full text-left px-3 py-2 rounded-xl border border-[#bcaaa4] transition-all ${mode === 'words' ? 'bg-[#3e2723] text-[#ffecb3]' : 'bg-[#efebe9] text-[#5d4037]'}`}
                  >
                    3. Rangkai Kata Utuh
                  </button>
                </div>
              </div>

              <!-- Level Selector -->
              <div className="bg-[#fffdf5] border-2 border-[#5d4037] rounded-2xl p-3.5 shadow-md">
                <div className="flex justify-between items-center mb-2">
                  <h2 className="font-bold text-xs uppercase tracking-wider text-[#5d4037] flex items-center gap-1.5">
                    <span>📶</span> TINGKAT KESULITAN
                  </h2>
                  <button
                    onClick={() => loadNextQuestion(score, mode, level)}
                    className="text-[10px] font-bold bg-[#efebe9] text-[#5d4037] px-2 py-1 rounded-lg border border-[#bcaaa4] hover:bg-[#d7ccc8]"
                  >
                    🔄 Acak Soal
                  </button>
                </div>

                <div className="grid grid-cols-4 gap-1.5 font-extrabold text-xs">
                  {[1, 2, 3, 4].map(l => (
                    <button
                      key={l}
                      onClick={() => { setLevel(l); loadNextQuestion(score, mode, l); }}
                      className={`py-2 rounded-xl border border-[#5d4037] ${level === l ? 'bg-[#ffb300] text-[#3e2723]' : 'bg-[#efebe9] text-[#5d4037]'}`}
                    >
                      Lv {l}
                    </button>
                  ))}
                </div>

                <p className="text-[11px] text-[#5d4037] mt-2 leading-tight">
                  {level === 1 && "Level 1: Vokal Dasar (A, I, U) tanpa sandhangan panyigeg."}
                  {level === 2 && "Level 2: Tambah Ê pepet ꦼ, É taling ꦺ, O ꦺꦴ."}
                  {level === 3 && "Level 3: Tambah Cecak (-ng), Layar (-r), Wignyan (-h)."}
                  {level === 4 && "Level 4: Lengkap + Pa Cerek (ꦉ) & Nga Lelet (ꦊ)."}
                </p>
              </div>

              <!-- Power-Up Info -->
              <div className="bg-[#fffdf5] border-2 border-[#5d4037] rounded-2xl p-3.5 shadow-md">
                <h2 className="font-bold text-xs uppercase tracking-wider text-[#5d4037] mb-2 flex items-center gap-1.5">
                  <span>✨</span> PUSAKA CETBANG
                </h2>
                <div className="space-y-1.5 text-[11px] text-[#5d4037]">
                  <div className="flex items-center gap-2 bg-[#fff3e0] p-1.5 rounded-lg border border-[#ffe0b2]">
                    <span class="text-base">🏹</span>
                    <div><b>Pasopati:</b> Hapus 2 opsi salah secara otomatis</div>
                  </div>
                  <div className="flex items-center gap-2 bg-[#e0f7fa] p-1.5 rounded-lg border border-[#b2ebf2]">
                    <span class="text-base">⚡</span>
                    <div><b>Gundala:</b> Bekukan gerak target 5 detik</div>
                  </div>
                  <div className="flex items-center gap-2 bg-[#e8f5e9] p-1.5 rounded-lg border border-[#c8e6c9]">
                    <span class="text-base">💧</span>
                    <div><b>Banyu Mili:</b> Pulihkan +1 Nyawa</div>
                  </div>
                </div>
              </div>

              <!-- Paugeran Dictionary Button -->
              <button
                onClick={() => setPaugeranOpen(true)}
                className="w-full py-2.5 bg-[#3e2723] text-[#ffecb3] font-bold text-xs rounded-xl border border-[#1c110f] shadow-md hover:bg-[#4e342e] transition-all flex items-center justify-center gap-2"
              >
                <span>📜</span> KAMUS PAUGERAN AKSARA
              </button>

            </div>

          </div>

          <!-- PAUGERAN DICTIONARY MODAL -->
          {paugeranOpen && (
            <div className="fixed inset-0 bg-[#3e2723]/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#fffdf5] border-4 border-[#ffb300] rounded-3xl p-5 max-w-lg w-full max-h-[85vh] overflow-y-auto shadow-2xl relative">
                <div className="flex justify-between items-center mb-4 border-b border-[#d7ccc8] pb-2">
                  <h2 className="font-extrabold text-lg text-[#3e2723] flex items-center gap-2">
                    📜 PAUGERAN AKSARA JAWA
                  </h2>
                  <button
                    onClick={() => setPaugeranOpen(false)}
                    className="w-8 h-8 rounded-full bg-[#efebe9] text-[#5d4037] font-bold text-sm flex items-center justify-center border border-[#bcaaa4] hover:bg-[#d7ccc8]"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-4 text-xs text-[#3e2723]">
                  <div>
                    <h3 className="font-extrabold text-sm text-[#ff6f00] mb-1">1. Sandhangan Swara (Vokal)</h3>
                    <div className="grid grid-cols-2 gap-2">
                      <div className="bg-[#fff3e0] p-2 rounded-lg border border-[#ffe0b2]"><b>Wulu (ꦶ)</b> = Vocal I (Ki = ꦏꦶ)</div>
                      <div className="bg-[#fff3e0] p-2 rounded-lg border border-[#ffe0b2]"><b>Suku (ꦸ)</b> = Vocal U (Ku = ꦏꦸ)</div>
                      <div className="bg-[#fff3e0] p-2 rounded-lg border border-[#ffe0b2]"><b>Pepet (ꦼ)</b> = Vocal Ê (Kê = ꦏꦼ)</div>
                      <div className="bg-[#fff3e0] p-2 rounded-lg border border-[#ffe0b2]"><b>Taling (ꦺ)</b> = Vocal É (Ké = ꦏꦺ)</div>
                      <div className="bg-[#fff3e0] p-2 rounded-lg border border-[#ffe0b2] col-span-2"><b>Taling-Tarung (ꦺꦴ)</b> = Vocal O (Ko = ꦏꦺꦴ)</div>
                    </div>
                  </div>

                  <div>
                    <h3 className="font-extrabold text-sm text-[#ff6f00] mb-1">2. Sandhangan Panyigeg (Mati)</h3>
                    <div className="grid grid-cols-3 gap-2">
                      <div className="bg-[#efebe9] p-2 rounded-lg border border-[#d7ccc8]"><b>Cecak (ꦁ)</b> = -NG</div>
                      <div className="bg-[#efebe9] p-2 rounded-lg border border-[#d7ccc8]"><b>Layar (ꦂ)</b> = -R</div>
                      <div className="bg-[#efebe9] p-2 rounded-lg border border-[#d7ccc8]"><b>Wignyan (ꦃ)</b> = -H</div>
                    </div>
                  </div>

                  <div>
                    <h3 className="font-extrabold text-sm text-[#ff6f00] mb-1">3. Aksara Khusus</h3>
                    <div className="grid grid-cols-2 gap-2">
                      <div className="bg-[#fffecb] p-2 rounded-lg border border-[#fff59d]"><b>Pa Cerek (ꦉ)</b> = RÊ</div>
                      <div className="bg-[#fffecb] p-2 rounded-lg border border-[#fff59d]"><b>Nga Lelet (ꦊ)</b> = LÊ</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          <!-- GAME OVER MODAL -->
          {isGameOver && (
            <div className="fixed inset-0 bg-[#3e2723]/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#fffdf5] border-4 border-[#ffb300] rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl relative">
                <div className="font-jawa text-3xl text-[#3e2723] mb-1">ꦒꦩꦺꦎꦮ꦳ꦼꦂ</div>
                <h2 className="font-black text-2xl text-[#3e2723] mb-2">GAME OVER!</h2>
                
                <div className="bg-[#fff3e0] rounded-2xl p-4 my-4 border border-[#ffe0b2]">
                  <div className="text-xs font-bold text-[#8d6e63]">SKOR AKHIR</div>
                  <div className="text-4xl font-extrabold text-[#ff6f00]">{score}</div>
                </div>

                <button
                  onClick={restartGame}
                  className="w-full py-3 bg-[#3e2723] text-[#ffecb3] font-black text-base rounded-2xl border-2 border-[#1c110f] shadow-lg hover:bg-[#4e342e] transition-all"
                >
                  🔄 MAIN LAGI
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
